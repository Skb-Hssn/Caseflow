[package]
name = "run-cli"
version = "0.3.0"
edition = "2021"
description = "Interactive competitive-programming runner"
license = "MIT"

[[bin]]
name = "run-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
chrono = "0.4"
crossterm = "0.28"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
shell-words = "1.1"
signal-hook = "0.3"
toml = "0.8"
unicode-width = "0.1"

[dev-dependencies]
tempfile = "3.14"
portable-pty = "0.8"
